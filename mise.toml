min_version = "2026.3.0"

[settings]
quiet = true
task_output = "interleave"
experimental = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
usage = "latest"
uv = "latest"
ruff = "0.15.18"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
"aqua:shenwei356/rush" = "0.9.0" # Cross-file BATS parallel runner
"shiv:codebase" = "0.4"                    # Codebase linting + migrations
"shiv:readme" = "0.1"                      # README generation/checks
"shiv:shell" = "0.1.3"                     # Persistent terminal sessions (used by wake)
"github:KnickKnackLabs/pi" = { version = "v0.83.0-kkl", minimum_release_age = "6h" } # Cool compatible KKL patches before install
claude = "latest"                          # Claude Code harness (lib/harness/claude.sh)
erlang = "28.4.1"
elixir = "1.19.5-otp-27"

[_.codebase]
lint = ["@all"]
