name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  MISE_JOBS: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve mise cache window
        run: echo "MISE_CACHE_WINDOW=$(($(date -u +%s) / 432000))" >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          # Retain mise-action's platform and config dimensions while rotating
          # mutable tool-selector caches every five UTC days.
          cache_key: "{{default}}-{{env.MISE_CACHE_WINDOW}}"

      - name: Install CLI dependencies
        run: mise run cli:build

      - name: Run BATS tests
        run: mise run test

      - name: Run CLI tests
        run: cd cli && mix test

      - name: Run Python lint
        run: mise run lint:python

      - name: Run codebase lints
        run: codebase lint "$PWD"
